name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      # Nunca roda e2e: ele chama o Gemini real e consome cota. Nenhum secret é exposto a este workflow.
      - run: uv run pytest -q -m "not e2e"

  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uvx ruff@0.17.0 check aurora tests
      - run: uvx ruff@0.17.0 format --check aurora tests
      - run: uv run --with mypy==2.4.0 mypy aurora --ignore-missing-imports
